<html>
<head>
  <style>
    #info-message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--homey-su-4);
      text-align: center;
      color: #f0f0f0;
    }

    #flow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--homey-su-2) var(--homey-su-3);
      height: 100%;
      color: #f0f0f0;
    }

    .plant-title {
      margin-bottom: var(--homey-su-1);
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f0f0f0;
    }

    #flow-svg {
      width: 100%;
      max-width: 340px;
      height: auto;
      flex: 1;
    }

    .node-box {
      fill: rgba(32, 32, 32, 0.95);
      stroke-width: 2;
    }

    .node-box.pv { stroke: #e6a817; }
    .node-box.house { stroke: #7AB31B; }
    .node-box.grid { stroke: #5b8def; }
    .node-box.battery { stroke: #7AB31B; }
    .node-box.wallbox { stroke: #8b6cc1; }

    .node-icon {
      font-size: 16px;
      fill: #ffffff;
    }

    .node-label {
      fill: #c8c8c8;
      font-size: 8px;
    }

    .node-value {
      fill: #ffffff;
      font-size: 10px;
      font-weight: 600;
    }

    .node-soc {
      fill: #a8a8a8;
      font-size: 8px;
    }

    .flow-line {
      stroke-width: 2;
      fill: none;
      opacity: 0.15;
      stroke: rgba(255, 255, 255, 0.35);
      transition: opacity 0.3s ease, stroke-width 0.3s ease;
    }

    .flow-line.active {
      opacity: 0.9;
      stroke-width: 2.5;
    }

    .flow-dot {
      display: none;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.45));
    }

    .flow-dot.active {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="homey-widget-full">
<div id="info-message" class="homey-widget hidden">
  <span id="info-message-value"></span>
</div>
<div id="flow-container" class="homey-widget hidden">
  <div id="plant-title" class="homey-text-bold plant-title"></div>
  <svg id="flow-svg" viewBox="0 0 320 278" xmlns="http://www.w3.org/2000/svg">
    <!-- Fluss zwischen Box-Kanten; Werte liegen in den Boxen, nicht auf den Linien -->
    <line id="flow-pv-house" x1="160" y1="44" x2="160" y2="108" class="flow-line" data-color="#e6a817"/>
    <line id="flow-pv-battery" x1="214" y1="26" x2="262" y2="104" class="flow-line" data-color="#e6a817"/>
    <line id="flow-grid-house" x1="70" y1="140" x2="120" y2="140" class="flow-line" data-color="#5b8def"/>
    <line id="flow-house-grid" x1="120" y1="144" x2="70" y2="144" class="flow-line" data-color="#5b8def"/>
    <line id="flow-battery-house" x1="250" y1="140" x2="200" y2="140" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-battery" x1="200" y1="144" x2="250" y2="144" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-wallbox" x1="160" y1="166" x2="160" y2="226" class="flow-line" data-color="#8b6cc1"/>
    <line id="flow-pv-wallbox" x1="96" y1="44" x2="96" y2="226" class="flow-line" data-color="#e6a817"/>
    <g id="flow-dots"></g>

    <!-- Oben: PV — Icon links, Werte rechts in der Box -->
    <g id="node-pv" transform="translate(96, 8)">
      <rect width="128" height="36" rx="6" class="node-box pv"/>
      <text x="14" y="23" class="node-icon">☀</text>
      <text x="118" y="15" class="node-label" text-anchor="end" data-i18n="widget.live.pv">PV</text>
      <text id="pv-value" x="118" y="28" class="node-value" text-anchor="end">0 W</text>
    </g>

    <!-- Mitte: Haus — Icon links, Werte rechts -->
    <g id="node-house" transform="translate(120, 108)">
      <rect width="80" height="58" rx="6" class="node-box house"/>
      <text x="14" y="34" class="node-icon">⌂</text>
      <text x="70" y="24" class="node-label" text-anchor="end" data-i18n="widget.consumption">Verbrauch</text>
      <text id="house-value" x="70" y="38" class="node-value" text-anchor="end">0 W</text>
    </g>

    <!-- Links: Netz — Icon oben, Werte unten in der Box -->
    <g id="node-grid" transform="translate(8, 114)">
      <rect width="62" height="54" rx="6" class="node-box grid"/>
      <text x="31" y="20" class="node-icon" text-anchor="middle">⚡</text>
      <text id="grid-label" x="31" y="36" class="node-label" text-anchor="middle">Netz</text>
      <text id="grid-value" x="31" y="48" class="node-value" text-anchor="middle">0 W</text>
    </g>

    <!-- Rechts: Batterie — Icon oben, Werte unten -->
    <g id="node-battery" transform="translate(250, 104)">
      <rect width="62" height="62" rx="6" class="node-box battery"/>
      <text x="31" y="20" class="node-icon" text-anchor="middle">🔋</text>
      <text x="31" y="36" class="node-label" text-anchor="middle" data-i18n="widget.battery.general">Batterie</text>
      <text id="battery-value" x="31" y="48" class="node-value" text-anchor="middle">0 W</text>
      <text id="battery-soc" x="31" y="58" class="node-soc" text-anchor="middle">0%</text>
    </g>

    <!-- Unten: Wallbox — Icon links, Werte rechts -->
    <g id="node-wallbox" transform="translate(84, 226)">
      <rect width="152" height="36" rx="6" class="node-box wallbox"/>
      <text x="14" y="23" class="node-icon">🚗</text>
      <text x="142" y="15" class="node-label" text-anchor="end" data-i18n="widget.wallbox.consumption">Wallbox</text>
      <text id="wallbox-value" x="142" y="28" class="node-value" text-anchor="end">0 W</text>
    </g>
  </svg>
</div>
<script type="text/javascript">
  const SYNC_INTERVAL = 10000;
  const WIDGET_HEIGHT = 310;
  const FLOW_DOT_COUNT = 2;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const flowAnim = {
    running: false,
    progress: {},
    dots: {},
  };

  function onHomeyReady(Homey) {
    initFlowDots();
    startFlowAnimation();
    setTimeout(() => {
      sync(true).then(() => autoSync());
    }, 250);
  }

  function autoSync() {
    sync(false).then(() => setTimeout(() => autoSync(), SYNC_INTERVAL));
  }

  function initFlowDots() {
    const container = document.getElementById('flow-dots');
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      flowAnim.progress[id] = 0;
      flowAnim.dots[id] = [];
      for (let i = 0; i < FLOW_DOT_COUNT; i++) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('class', 'flow-dot');
        dot.setAttribute('data-line', id);
        container.appendChild(dot);
        flowAnim.dots[id].push(dot);
      }
    });
  }

  function startFlowAnimation() {
    if (flowAnim.running) return;
    flowAnim.running = true;
    let lastTs = performance.now();

    function frame(ts) {
      const dt = Math.min(ts - lastTs, 50);
      lastTs = ts;
      animateFlowDots(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getLineCoords(line) {
    return {
      x1: parseFloat(line.getAttribute('x1')),
      y1: parseFloat(line.getAttribute('y1')),
      x2: parseFloat(line.getAttribute('x2')),
      y2: parseFloat(line.getAttribute('y2')),
      color: line.getAttribute('data-color') || '#7AB31B',
    };
  }

  function animateFlowDots(dt) {
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      const dots = flowAnim.dots[id] || [];
      const active = line.classList.contains('active');
      const reverse = line.classList.contains('reverse');
      const coords = getLineCoords(line);
      const speed = 0.00035 * (1 + (line.getAttribute('data-power') || 0) / 2000);

      dots.forEach((dot, index) => {
        if (!active) {
          dot.classList.remove('active');
          return;
        }
        dot.classList.add('active');
        dot.setAttribute('fill', coords.color);

        const offset = index / FLOW_DOT_COUNT;
        let t = (flowAnim.progress[id] + offset) % 1;
        if (reverse) t = 1 - t;
        dot.setAttribute('cx', coords.x1 + (coords.x2 - coords.x1) * t);
        dot.setAttribute('cy', coords.y1 + (coords.y2 - coords.y1) * t);
      });

      if (active) {
        flowAnim.progress[id] = (flowAnim.progress[id] + speed * dt) % 1;
      }
    });
  }

  async function sync(asInit) {
    try {
      const plant = await resolvePlant(Homey);
      if (plant.errorMsg) {
        showMessage(Homey.__(plant.errorMsg));
        setHeight(Homey, asInit, 60);
        return;
      }
      const settings = Homey.getSettings();
      updateFlow(plant, settings, Homey);
      showFlow();
      setHeight(Homey, asInit, WIDGET_HEIGHT);
    } catch (e) {
      showMessage(e.toString());
      setHeight(Homey, asInit, 60);
    }
  }

  function setHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height });
    } else {
      Homey.setHeight(height);
    }
  }

  function selectedPlantId(settings) {
    if (settings.plantId == null) {
      return null;
    }
    return settings.plantId.id != null ? settings.plantId.id : settings.plantId;
  }

  function plantMatches(plant, plantId) {
    return String(plant.id) === String(plantId);
  }

  async function resolvePlant(Homey) {
    const settings = Homey.getSettings();
    const plants = await Homey.api('GET', '/');
    if (plants.length === 0) {
      return { errorMsg: 'widget.info.no-plants' };
    }
    const wantedId = selectedPlantId(settings);
    if (wantedId == null) {
      if (plants.length === 1) {
        return plants[0];
      }
      return { errorMsg: 'widget.info.no-plant-id' };
    }
    const device = plants.find(hps => plantMatches(hps, wantedId));
    if (!device) {
      return { errorMsg: 'widget.info.plant-not-found' };
    }
    return device;
  }

  function showMessage(text) {
    document.getElementById('flow-container').classList.add('hidden');
    const info = document.getElementById('info-message');
    info.classList.remove('hidden');
    document.getElementById('info-message-value').innerText = text;
  }

  function showFlow() {
    document.getElementById('info-message').classList.add('hidden');
    document.getElementById('flow-container').classList.remove('hidden');
  }

  function formatW(w) {
    const abs = Math.abs(Math.round(w));
    if (abs >= 1000) {
      return (w / 1000).toFixed(1) + ' kW';
    }
    return abs + ' W';
  }

  /** Batterieladung: zuerst PV-Überschuss nach Hausverbrauch, Rest über Netz (Haus als Verteiler). */
  function splitBatteryChargeW(powerState) {
    const batteryChargeW = Math.max(0, powerState.batteryPower);
    if (batteryChargeW <= 0) {
      return { fromPvW: 0, fromGridW: 0 };
    }
    const pvAfterHouse = Math.max(0, powerState.pvPower - powerState.consumption);
    const fromPvW = Math.min(batteryChargeW, pvAfterHouse);
    const fromGridW = Math.max(0, batteryChargeW - fromPvW);
    return { fromPvW, fromGridW };
  }

  function setFlowLine(id, active, reverse, powerW) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', active);
    el.classList.toggle('reverse', !!reverse);
    if (active) {
      el.style.stroke = el.getAttribute('data-color');
      el.setAttribute('data-power', String(Math.abs(powerW || 0)));
    } else {
      el.style.stroke = '';
      el.removeAttribute('data-power');
    }
  }

  function setWidgetText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function updateFlow(plant, settings, Homey) {
    const d = plant.powerState;
    setWidgetText('plant-title', plant.name);
    setWidgetText('pv-value', formatW(d.pvPower));
    setWidgetText('house-value', formatW(d.consumption));
    setWidgetText('grid-value', formatW(Math.abs(d.gridPower)));
    setWidgetText('battery-value', formatW(Math.abs(d.batteryPower)));
    setWidgetText('battery-soc', Math.round(d.batteryLevel) + '%');
    setWidgetText('wallbox-value', formatW(d.wallboxPower));

    const gridImport = d.gridPower < 0;
    const gridExport = d.gridPower > 0;
    setWidgetText('grid-label', gridImport
      ? Homey.__('widget.grid.purchase')
      : gridExport
        ? Homey.__('widget.grid.feed-in')
        : Homey.__('widget.grid.general'));

    const batteryDischarge = d.batteryPower < 0;
    const threshold = settings.flowThreshold != null ? settings.flowThreshold : 30;
    const showBattery = settings.showBattery !== false;
    const chargeSplit = splitBatteryChargeW(d);

    document.getElementById('node-battery').style.opacity = showBattery ? '1' : '0.25';
    document.getElementById('node-wallbox').style.opacity = settings.showWallbox !== false ? '1' : '0.25';

    const pvToHouseW = Math.max(0, Math.min(d.pvPower, d.consumption));
    const pvToHouse = pvToHouseW > threshold;
    const pvToBattery = showBattery && chargeSplit.fromPvW > threshold;
    const gridToHouse = gridImport && Math.abs(d.gridPower) > threshold;
    const houseToGrid = gridExport && Math.abs(d.gridPower) > threshold;
    const batteryToHouse = showBattery && batteryDischarge && Math.abs(d.batteryPower) > threshold;
    const houseToBattery = showBattery && chargeSplit.fromGridW > threshold;
    const houseToWallbox = settings.showWallbox !== false && d.wallboxPower > threshold;
    const pvToWallbox = settings.showWallbox !== false && d.wallboxSolarShare > threshold;

    setFlowLine('flow-pv-house', pvToHouse, false, pvToHouseW);
    setFlowLine('flow-pv-battery', pvToBattery, false, chargeSplit.fromPvW);
    setFlowLine('flow-grid-house', gridToHouse, false, d.gridPower);
    setFlowLine('flow-house-grid', houseToGrid, true, d.gridPower);
    setFlowLine('flow-battery-house', batteryToHouse, false, d.batteryPower);
    setFlowLine('flow-house-battery', houseToBattery, false, chargeSplit.fromGridW);
    setFlowLine('flow-house-wallbox', houseToWallbox && !pvToWallbox, false, d.wallboxPower);
    setFlowLine('flow-pv-wallbox', pvToWallbox, false, d.wallboxSolarShare);
  }
</script>
</body>
</html>
