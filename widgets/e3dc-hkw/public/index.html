<html>
<head>
  <style>
    /* Live energy flow styles */
    #info-message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--homey-su-4);
      text-align: center;
      color: #f0f0f0;
    }

    #flow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--homey-su-2) var(--homey-su-3);
      color: #f0f0f0;
    }

    .plant-title {
      margin-bottom: var(--homey-su-1);
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f0f0f0;
    }

    #flow-svg {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    .node-box {
      fill: rgba(32, 32, 32, 0.95);
      stroke-width: 2;
    }

    .node-box.pv { stroke: #e6a817; }
    .node-box.house { stroke: #7AB31B; }
    .node-box.grid { stroke: #5b8def; }
    .node-box.battery { stroke: #7AB31B; }
    .node-box.wallbox { stroke: #8b6cc1; }

    .node-icon {
      font-size: 16px;
      fill: #ffffff;
    }

    .node-label {
      fill: #c8c8c8;
      font-size: 8px;
    }

    .node-value {
      fill: #ffffff;
      font-size: 10px;
      font-weight: 600;
    }

    .node-soc {
      fill: #a8a8a8;
      font-size: 8px;
    }

    .flow-line {
      stroke-width: 2;
      fill: none;
      opacity: 0.15;
      stroke: rgba(255, 255, 255, 0.35);
      transition: opacity 0.3s ease, stroke-width 0.3s ease;
    }

    .flow-line.active {
      opacity: 0.9;
      stroke-width: 2.5;
    }

    .flow-dot {
      display: none;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.45));
    }

    .flow-dot.active {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    /* Overview grid styles */
    #overview-container {
      height: auto;
      display: grid;
      grid-template-columns: auto auto;
      gap: var(--homey-su-3);
      margin-top: var(--homey-su-4);
      padding: 0 var(--homey-su-2);
    }

    #overview-container .grid-item {
      display: flex;
      justify-content: center;
    }

    #overview-container .grid-item span {
      display: flex;
      align-items: center;
    }

    #overview-container .grid-title {
      display: flex;
      justify-content: start;
      align-items: start;
      grid-column: 1 / -1;
      border-bottom: var(--homey-line);
    }

    #overview-container .grid-title span {
      display: flex;
      align-items: start;
      justify-self: start;
      margin-bottom: var(--homey-su-2);
    }

    #overview-container .left {
      justify-self: start;
    }

    #overview-container .right {
      justify-self: end;
    }
  </style>
</head>

<body class="homey-widget-full">

</div>

<script type="text/javascript">
  const SYNC_INTERVAL = 10000;
  const WIDGET_HEIGHT = 550;
  const FLOW_DOT_COUNT = 2;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const flowAnim = {
    running: false,
    progress: {},
    dots: {},
  };

  function onHomeyReady(Homey) {
    initFlowDots();
    startFlowAnimation();
    setTimeout(() => {
      sync(true).then(() => autoSync());
    }, 250);
  }

  function autoSync() {
    sync(false).then(() => setTimeout(() => autoSync(), SYNC_INTERVAL));
  }

  function initFlowDots() {
    const container = document.getElementById('flow-dots');
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      flowAnim.progress[id] = 0;
      flowAnim.dots[id] = [];
      for (let i = 0; i < FLOW_DOT_COUNT; i++) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('class', 'flow-dot');
        dot.setAttribute('data-line', id);
        container.appendChild(dot);
        flowAnim.dots[id].push(dot);
      }
    });
  }

  function startFlowAnimation() {
    if (flowAnim.running) return;
    flowAnim.running = true;
    let lastTs = performance.now();

    function frame(ts) {
      const dt = Math.min(ts - lastTs, 50);
      lastTs = ts;
      animateFlowDots(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getLineCoords(line) {
    return {
      x1: parseFloat(line.getAttribute('x1')),
      y1: parseFloat(line.getAttribute('y1')),
      x2: parseFloat(line.getAttribute('x2')),
      y2: parseFloat(line.getAttribute('y2')),
      color: line.getAttribute('data-color') || '#7AB31B',
    };
  }

  function animateFlowDots(dt) {
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      const dots = flowAnim.dots[id] || [];
      const active = line.classList.contains('active');
      const reverse = line.classList.contains('reverse');
      const coords = getLineCoords(line);
      const speed = 0.00035 * (1 + (line.getAttribute('data-power') || 0) / 2000);

      dots.forEach((dot, index) => {
        if (!active) {
          dot.classList.remove('active');
          return;
        }
        dot.classList.add('active');
        dot.setAttribute('fill', coords.color);

        const offset = index / FLOW_DOT_COUNT;
        let t = (flowAnim.progress[id] + offset) % 1;
        if (reverse) t = 1 - t;
        dot.setAttribute('cx', coords.x1 + (coords.x2 - coords.x1) * t);
        dot.setAttribute('cy', coords.y1 + (coords.y2 - coords.y1) * t);
      });

      if (active) {
        flowAnim.progress[id] = (flowAnim.progress[id] + speed * dt) % 1;
      }
    });
  }

  function setFlowLine(id, active, reverse, powerW) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', active);
    el.classList.toggle('reverse', !!reverse);
    if (active) {
      el.style.stroke = el.getAttribute('data-color');
      el.setAttribute('data-power', String(Math.abs(powerW || 0)));
    } else {
      el.style.stroke = '';
      el.removeAttribute('data-power');
    }
  }

  function setWidgetText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function updateFlow(plant, settings, Homey) {
    const d = plant.powerState;
    setWidgetText('plant-title', plant.name);
    setWidgetText('pv-value', formatW(d.pvPower));
    setWidgetText('house-value', formatW(d.consumption));
    setWidgetText('grid-value', formatW(Math.abs(d.gridPower)));
    setWidgetText('battery-value', formatW(Math.abs(d.batteryPower)));
    setWidgetText('battery-soc', Math.round(d.batteryLevel) + '%');
    setWidgetText('wallbox-value', formatW(d.wallboxPower));

    // Keep label simple as "Netz" — direction is now clear from the flow arrows
    setWidgetText('grid-label', 'Netz');

    const pvToHouseW = Math.max(0, Math.min(d.pvPower, d.consumption));
    const pvToWallboxW = Math.max(0, d.wallboxSolarShare);
    const pvToHouse = pvToHouseW > (settings.flowThreshold || 30);
    const pvToWallbox = pvToWallboxW > (settings.flowThreshold || 30);

    const houseToGridW = Math.max(0, d.gridPower);     // export (positive gridPower)
    const gridToHouseW = Math.max(0, -d.gridPower);    // import (negative gridPower)
    const houseToBatteryW = Math.max(0, d.batteryPower);
    const houseToWallboxW = Math.max(0, d.wallboxPower - d.wallboxSolarShare);
    const houseToGrid = houseToGridW > (settings.flowThreshold || 30);
    const houseToBattery = houseToBatteryW > (settings.flowThreshold || 30);
    const houseToWallbox = houseToWallboxW > (settings.flowThreshold || 30);

    const gridToHouse = gridToHouseW > (settings.flowThreshold || 30);
    const batteryToHouse = Math.max(0, -d.batteryPower) > (settings.flowThreshold || 30);

    const showWallbox = settings.showWallbox !== false;
    const showBattery = settings.showBattery !== false;

    document.getElementById('node-wallbox').style.display = showWallbox ? '' : 'none';
    document.getElementById('node-battery').style.display = showBattery ? '' : 'none';

    // Also hide wallbox flow lines when wallbox node is hidden
    const wallboxLine1 = document.getElementById('flow-house-wallbox');
    const wallboxLine2 = document.getElementById('flow-pv-wallbox');
    if (wallboxLine1) wallboxLine1.style.display = showWallbox ? '' : 'none';
    if (wallboxLine2) wallboxLine2.style.display = showWallbox ? '' : 'none';

    const chargeSplit = splitBatteryChargeW(d);

    setFlowLine('flow-pv-house', pvToHouse, false, pvToHouseW);
    setFlowLine('flow-grid-house', gridToHouse, false, gridToHouseW);
    setFlowLine('flow-house-grid', houseToGrid, false, houseToGridW);
    setFlowLine('flow-battery-house', batteryToHouse, false, Math.max(0, -d.batteryPower));
    setFlowLine('flow-house-battery', houseToBattery, false, chargeSplit.fromGridW);
    setFlowLine('flow-house-wallbox', houseToWallbox && !pvToWallbox && showWallbox, false, d.wallboxPower);
    setFlowLine('flow-pv-wallbox', pvToWallbox && showWallbox, false, d.wallboxSolarShare);
  }

  function formatW(w) {
    const abs = Math.abs(Math.round(w));
    if (abs >= 1000) {
      return (w / 1000).toFixed(1) + ' kW';
    }
    return abs + ' W';
  }

  function splitBatteryChargeW(powerState) {
    // positive batteryPower = charging battery (in)
    const batteryChargeW = Math.max(0, powerState.batteryPower);
    if (batteryChargeW <= 0) {
      return { fromPvW: 0, fromGridW: 0 };
    }
    const pvAfterHouse = Math.max(0, powerState.pvPower - powerState.consumption);
    const fromPvW = Math.min(batteryChargeW, pvAfterHouse);
    const fromGridW = Math.max(0, batteryChargeW - fromPvW);
    return { fromPvW, fromGridW };
  }

  function setHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height });
    } else {
      Homey.setHeight(height);
    }
  }

  function selectedPlantId(settings) {
    if (settings.plantId == null) {
      return null;
    }
    return settings.plantId.id != null ? settings.plantId.id : settings.plantId;
  }

  function plantMatches(plant, plantId) {
    return String(plant.id) === String(plantId);
  }

  async function resolvePlant(Homey) {
    const settings = Homey.getSettings();
    const plants = await Homey.api('GET', '/');
    if (plants.length === 0) {
      return { errorMsg: 'widget.info.no-plants' };
    }
    const wantedId = selectedPlantId(settings);
    if (wantedId == null) {
      if (plants.length === 1) {
        return plants[0];
      }
      return { errorMsg: 'widget.info.no-plant-id' };
    }
    const device = plants.find(hps => plantMatches(hps, wantedId));
    if (device) {
      return device;
    }
    return { errorMsg: 'widget.info.plant-not-found' };
  }

  function showMessage(text) {
    document.getElementById('flow-container').classList.add('hidden');
    const info = document.getElementById('info-message');
    info.classList.remove('hidden');
    document.getElementById('info-message-value').innerText = text;
  }

  function showFlow() {
    document.getElementById('info-message').classList.add('hidden');
    document.getElementById('flow-container').classList.remove('hidden');
    document.getElementById('overview-container').classList.remove('hidden');
  }

  function hideOrShow(className, show) {
    const elements = document.getElementsByClassName(className);
    for (let i = 0; i < elements.length; i++) {
      const element = elements[i];
      const currentlyVisible = !element.classList.contains('hidden');
      if (show && !currentlyVisible) {
        element.classList.remove('hidden');
      } else if (!show && currentlyVisible) {
        element.classList.add('hidden');
      }
    }
  }

  function configureVisibility(settings, data) {
    hideOrShow('grid-title', settings.deviceNameVisible);
    hideOrShow('consumption', settings.consumptionVisible);
    hideOrShow('pv-power', settings.pvDeliveryVisible);
    hideOrShow('grid', settings.gridVisible);
    hideOrShow('battery', settings.batteryVisible);
    hideOrShow('battery-level', settings.batteryLevelVisible);
    hideOrShow('wb-consumption', settings.wallboxConsumptionVisible);
    hideOrShow('solar-share', settings.solarShareVisible);
    hideOrShow('external-source', settings.externalSourceVisible);

    let visibleRows = 0;
    if (settings.consumptionVisible) visibleRows++;
    if (settings.pvDeliveryVisible) visibleRows++;
    if (settings.gridVisible) visibleRows++;
    if (settings.batteryVisible) visibleRows++;
    if (settings.batteryLevelVisible) visibleRows++;
    if (settings.wallboxConsumptionVisible) visibleRows++;
    if (settings.solarShareVisible) visibleRows++;
    if (settings.externalSourceVisible) visibleRows++;

    const threshold = settings.emptyThreshold || 10;
    const d = data || {};

    if (!settings.showEmpty) {
      if (settings.consumptionVisible && Math.abs(d.consumption || 0) < threshold) hideOrShow('consumption', false);
      if (settings.pvDeliveryVisible && Math.abs(d.pvPower || 0) < threshold) hideOrShow('pv-power', false);
      if (settings.gridVisible && Math.abs(d.gridPower || 0) < threshold) hideOrShow('grid', false);
      if (settings.batteryVisible && Math.abs(d.batteryPower || 0) < threshold) hideOrShow('battery', false);
      if (settings.batteryLevelVisible && (d.batteryLevel || 0) < 1) hideOrShow('battery-level', false);
      if (settings.wallboxConsumptionVisible && Math.abs(d.wallboxPower || 0) < threshold) hideOrShow('wb-consumption', false);
      if (settings.solarShareVisible && Math.abs(d.wallboxSolarShare || 0) < threshold) hideOrShow('solar-share', false);
      if (settings.externalSourceVisible && Math.abs(d.externalPower || 0) < threshold) hideOrShow('external-source', false);
    }
  }

  async function sync(asInit) {
    try {
      const plant = await resolvePlant(Homey);
      if (plant.errorMsg) {
        showMessage(Homey.__ ? Homey.__(plant.errorMsg) : plant.errorMsg);
        setHeight(Homey, asInit, 100);
        return;
      }

      const settings = Homey.getSettings();
      updateFlow(plant, settings, Homey);
      updateOverview(plant, settings);
      showFlow();
      setHeight(Homey, asInit, WIDGET_HEIGHT);
    } catch (e) {
      showMessage(e.toString());
      setHeight(Homey, asInit, 100);
    }
  }

  function updateOverview(plant, settings) {
    const d = plant.powerState || {};
    const container = document.getElementById('overview-container');
    if (container.classList.contains('hidden')) {
      container.classList.remove('hidden');
    }

    const titleEl = document.getElementById('grid-title-value');
    if (titleEl) titleEl.textContent = plant.name || 'E3DC';

    setWidgetText('consumption-value', formatW(d.consumption));
    setWidgetText('pv-power-value', formatW(d.pvPower));
    setWidgetText('overview-grid-value', formatW(Math.abs(d.gridPower)));
    setWidgetText('overview-battery-value', formatW(Math.abs(d.batteryPower)));
    setWidgetText('battery-level-value', Math.round(d.batteryLevel) + '%');
    setWidgetText('wb-consumption-value', formatW(d.wallboxPower));
    setWidgetText('solar-share-value', Math.round(d.wallboxSolarShare) + '%');
    setWidgetText('external-source-value', formatW(d.externalPower));

    // Update battery title to show charging or discharging
    // Positive batteryPower = charging the battery (Laden), negative = discharging (Entladen)
    const batteryTitleEl = document.getElementById('battery-title');
    if (batteryTitleEl) {
      if (d.batteryPower > 0) {
        batteryTitleEl.textContent = 'Bat. Laden';
      } else if (d.batteryPower < 0) {
        batteryTitleEl.textContent = 'Bat. Entladen';
      } else {
        batteryTitleEl.textContent = 'Batterie';
      }
    }

    configureVisibility(settings, d);
  }

  function configureHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height: height });
    } else {
      Homey.setHeight(height);
    }
  }

  // Initial call
  // The sync is called from onHomeyReady
</script>
