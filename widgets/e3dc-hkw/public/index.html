<html>
<head>
  <style>
    /* Live energy flow styles */
    #info-message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--homey-su-4);
      text-align: center;
      color: #f0f0f0;
      font-size: 16px;
    }

    #flow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--homey-su-2) var(--homey-su-3);
      color: #f0f0f0;
    }

    #flow-svg {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    .node-box {
      fill: rgba(32, 32, 32, 0.95);
      stroke-width: 2;
    }

    .node-box.pv { stroke: #e6a817; }
    .node-box.house { stroke: #7AB31B; }
    .node-box.grid { stroke: #5b8def; }
    .node-box.battery { stroke: #7AB31B; }
    .node-box.wallbox { stroke: #8b6cc1; }

    .node-icon {
      font-size: 20px;
      fill: #ffffff;
    }

    .node-label {
      fill: #c8c8c8;
      font-size: 13px;
    }

    .node-value {
      fill: #ffffff;
      font-size: 15px;
      font-weight: 600;
    }

    .node-soc {
      fill: #a8a8a8;
      font-size: 13px;
    }

    .flow-line {
      stroke-width: 2;
      fill: none;
      opacity: 0.15;
      stroke: rgba(255, 255, 255, 0.35);
      transition: opacity 0.3s ease, stroke-width 0.3s ease;
    }

    .flow-line.active {
      opacity: 0.9;
      stroke-width: 2.5;
    }

    .flow-dot {
      display: none;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.45));
    }

    .flow-dot.active {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body class="homey-widget-full">
<div id="info-message" class="homey-widget hidden">
  <span id="info-message-value"></span>
</div>

<!-- Live Energy Flow -->
<div id="flow-container" class="homey-widget hidden">
  <svg id="flow-svg" viewBox="0 0 320 278" xmlns="http://www.w3.org/2000/svg">
    <!-- Fluss direkt in die Symbole (keine Boxen mehr) -->
    <line id="flow-pv-house" x1="160" y1="44" x2="160" y2="103" class="flow-line" data-color="#e6a817"/>
    <line id="flow-grid-house" x1="68" y1="128" x2="115" y2="128" class="flow-line" data-color="#5b8def"/>
    <line id="flow-house-grid" x1="115" y1="132" x2="68" y2="132" class="flow-line" data-color="#5b8def"/>
    <line id="flow-battery-house" x1="250" y1="128" x2="200" y2="128" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-battery" x1="200" y1="132" x2="250" y2="132" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-wallbox" x1="160" y1="135" x2="160" y2="223" class="flow-line" data-color="#8b6cc1"/>
    <g id="flow-dots"></g>

    <!-- PV — Wert dadrüber, Icon zentriert darunter (verdoppelt) -->
    <g id="node-pv" transform="translate(130, 5)">
      <text id="pv-value" x="36" y="0" class="node-value" text-anchor="middle">0 W</text>
      <!-- Solar panels icon (deutlicheres Panel mit Gitter) -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="72" height="52" rx="4" fill="#E6A817" stroke="#222" stroke-width="2"/>
        <!-- Zellen-Gitter (6 Zellen) -->
        <rect x="6" y="6" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <rect x="28" y="6" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <rect x="50" y="6" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <rect x="6" y="28" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <rect x="28" y="28" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <rect x="50" y="28" width="18" height="18" fill="none" stroke="#333" stroke-width="1.2"/>
        <!-- kleine Sonne oben rechts -->
        <circle cx="84" cy="10" r="7" fill="#fff" opacity="0.9"/>
        <line x1="84" y1="2" x2="84" y2="0" stroke="#fff" stroke-width="1.6"/>
        <line x1="84" y1="18" x2="84" y2="20" stroke="#fff" stroke-width="1.6"/>
      </g>
    </g>

    <!-- Haus — Icon verdoppelt + Wert mittig -->
    <g id="node-house" transform="translate(100, 80)">
      <!-- House icon (mit Schornstein + Antenne) -->
      <g transform="translate(28, 8)">
        <!-- roof -->
        <polygon points="0,0 32,-22 64,0" fill="#7AB31B" stroke="#222" stroke-width="1.6"/>
        <!-- Schornstein -->
        <rect x="44" y="-16" width="10" height="18" fill="#555" stroke="#222" stroke-width="1"/>
        <!-- Antenne -->
        <line x1="10" y1="-4" x2="10" y2="-28" stroke="#ccc" stroke-width="2"/>
        <line x1="6" y1="-24" x2="14" y2="-24" stroke="#ccc" stroke-width="1.6"/>
        <!-- body -->
        <rect x="8" y="2" width="48" height="36" fill="#7AB31B" stroke="#222" stroke-width="1.6"/>
        <!-- door -->
        <rect x="26" y="20" width="12" height="18" fill="#222"/>
        <!-- window -->
        <rect x="12" y="10" width="8" height="8" fill="#fff" stroke="#222" stroke-width="0.8"/>
      </g>
      <!-- Verbrauch mittig auf dem Haus-Symbol -->
      <text id="house-value" x="60" y="48" class="node-value" text-anchor="middle">0 W</text>
    </g>

    <!-- Netz — Symbol verdoppelt, Wert mittig -->
    <g id="node-grid" transform="translate(5, 85)">
      <!-- Power pylon / Strommast (weiß) -->
      <g transform="translate(18, 2)">
        <!-- tower structure -->
        <line x1="5" y1="0" x2="5" y2="56" stroke="#fff" stroke-width="2.6"/>
        <line x1="9" y1="0" x2="9" y2="56" stroke="#fff" stroke-width="2.6"/>
        <!-- cross bars -->
        <line x1="3" y1="12" x2="11" y2="12" stroke="#fff" stroke-width="2"/>
        <line x1="1" y1="24" x2="13" y2="24" stroke="#fff" stroke-width="2"/>
        <line x1="2" y1="36" x2="12" y2="36" stroke="#fff" stroke-width="2"/>
        <line x1="4" y1="48" x2="10" y2="48" stroke="#fff" stroke-width="2"/>
        <!-- top -->
        <line x1="5" y1="0" x2="9" y2="0" stroke="#fff" stroke-width="2.4"/>
        <!-- wires -->
        <line x1="0" y1="6" x2="3" y2="6" stroke="#ddd" stroke-width="1.4"/>
        <line x1="11" y1="6" x2="14" y2="6" stroke="#ddd" stroke-width="1.4"/>
      </g>
      <!-- Wert mittig auf dem Symbol -->
      <text id="grid-value" x="32" y="70" class="node-value" text-anchor="middle">0 W</text>
    </g>

    <!-- Batterie — Symbol verdoppelt, Werte mittig -->
    <g id="node-battery" transform="translate(235, 75)">
      <!-- Battery icon (klassisch + klarer) -->
      <g transform="translate(12, 4)">
        <!-- Battery body -->
        <rect x="0" y="8" width="64" height="36" rx="4" fill="none" stroke="#333" stroke-width="3"/>
        <!-- Battery cap (oben) -->
        <rect x="22" y="0" width="20" height="8" rx="2" fill="#7AB31B" stroke="#333" stroke-width="1.6"/>
        <!-- + und - Pole -->
        <text x="10" y="32" font-size="14" fill="#333" font-weight="bold">+</text>
        <text x="52" y="32" font-size="14" fill="#333" font-weight="bold">−</text>
        <!-- Füllstand (dynamisch wirkend) -->
        <rect x="6" y="14" width="52" height="24" rx="2" fill="#7AB31B" opacity="0.35"/>
        <!-- Trennlinien für "Zellen" -->
        <line x1="26" y1="14" x2="26" y2="38" stroke="#333" stroke-width="1" opacity="0.4"/>
        <line x1="42" y1="14" x2="42" y2="38" stroke="#333" stroke-width="1" opacity="0.4"/>
      </g>
      <!-- Werte mittig auf dem Symbol -->
      <text id="battery-value" x="44" y="70" class="node-value" text-anchor="middle">0 W</text>
      <text id="battery-soc" x="44" y="84" class="node-soc" text-anchor="middle">0%</text>
      <text id="battery-charge-time" x="44" y="96" class="node-soc" text-anchor="middle">—</text>
    </g>

    <!-- Wallbox — Icon verdoppelt + Wert mittig -->
    <g id="node-wallbox" transform="translate(125, 200)">
      <!-- Wallbox / EV charger icon (besser erkennbarer Stecker) -->
      <g transform="translate(0, 3)">
        <!-- Wallbox-Gehäuse -->
        <rect x="0" y="0" width="36" height="52" rx="6" fill="#8B6CC1" stroke="#222" stroke-width="2"/>
        <!-- kleines Display / Blitz -->
        <rect x="8" y="8" width="20" height="16" rx="2" fill="#222"/>
        <path d="M14 10 L22 10 L17 18 L24 18 L15 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Kabel -->
        <path d="M36 26 Q52 18 64 26" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
        <!-- Typ-2-ähnlicher Stecker -->
        <rect x="60" y="16" width="18" height="20" rx="4" fill="#333"/>
        <!-- Pins -->
        <circle cx="66" cy="22" r="2.6" fill="#fff"/>
        <circle cx="74" cy="22" r="2.6" fill="#fff"/>
        <!-- Erdung oben -->
        <rect x="68" y="14" width="4" height="4" fill="#fff"/>
      </g>
      <!-- Wert mittig auf dem Symbol -->
      <text id="wallbox-value" x="42" y="70" class="node-value" text-anchor="middle">0 W</text>
    </g>
  </svg>
</div>

<script type="text/javascript">
  const SYNC_INTERVAL = 10000;
  const WIDGET_HEIGHT = 300;
  const FLOW_DOT_COUNT = 2;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const flowAnim = {
    running: false,
    progress: {},
    dots: {},
  };

  function onHomeyReady(Homey) {
    initFlowDots();
    startFlowAnimation();
    setTimeout(() => {
      sync(true).then(() => autoSync());
    }, 250);
  }

  function autoSync() {
    sync(false).then(() => setTimeout(() => autoSync(), SYNC_INTERVAL));
  }

  function initFlowDots() {
    const container = document.getElementById('flow-dots');
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      flowAnim.progress[id] = 0;
      flowAnim.dots[id] = [];
      for (let i = 0; i < FLOW_DOT_COUNT; i++) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('class', 'flow-dot');
        dot.setAttribute('data-line', id);
        container.appendChild(dot);
        flowAnim.dots[id].push(dot);
      }
    });
  }

  function startFlowAnimation() {
    if (flowAnim.running) return;
    flowAnim.running = true;
    let lastTs = performance.now();

    function frame(ts) {
      const dt = Math.min(ts - lastTs, 50);
      lastTs = ts;
      animateFlowDots(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getLineCoords(line) {
    return {
      x1: parseFloat(line.getAttribute('x1')),
      y1: parseFloat(line.getAttribute('y1')),
      x2: parseFloat(line.getAttribute('x2')),
      y2: parseFloat(line.getAttribute('y2')),
      color: line.getAttribute('data-color') || '#7AB31B',
    };
  }

  function animateFlowDots(dt) {
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      const dots = flowAnim.dots[id] || [];
      const active = line.classList.contains('active');
      const reverse = line.classList.contains('reverse');
      const coords = getLineCoords(line);
      const speed = 0.00035 * (1 + (line.getAttribute('data-power') || 0) / 2000);

      dots.forEach((dot, index) => {
        if (!active) {
          dot.classList.remove('active');
          return;
        }
        dot.classList.add('active');
        dot.setAttribute('fill', coords.color);

        const offset = index / FLOW_DOT_COUNT;
        let t = (flowAnim.progress[id] + offset) % 1;
        if (reverse) t = 1 - t;
        dot.setAttribute('cx', coords.x1 + (coords.x2 - coords.x1) * t);
        dot.setAttribute('cy', coords.y1 + (coords.y2 - coords.y1) * t);
      });

      if (active) {
        flowAnim.progress[id] = (flowAnim.progress[id] + speed * dt) % 1;
      }
    });
  }

  function setFlowLine(id, active, reverse, powerW) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', active);
    el.classList.toggle('reverse', !!reverse);
    if (active) {
      el.style.stroke = el.getAttribute('data-color');
      el.setAttribute('data-power', String(Math.abs(powerW || 0)));
    } else {
      el.style.stroke = '';
      el.removeAttribute('data-power');
    }
  }

  function setWidgetText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function updateFlow(plant, settings, Homey) {
    const d = plant.powerState;
    setWidgetText('pv-value', formatW(d.pvPower));
    setWidgetText('house-value', formatW(d.consumption));
    setWidgetText('grid-value', formatW(Math.abs(d.gridPower)));
    setWidgetText('battery-value', formatW(d.batteryPower));
    setWidgetText('battery-soc', Math.round(d.batteryLevel) + '%');
    setWidgetText('battery-charge-time', d.chargeTime || '—');
    setWidgetText('wallbox-value', formatW(d.wallboxPower));

    // Keep label simple as "Netz" — direction is now clear from the flow arrows
    setWidgetText('grid-label', 'Netz');

    const pvToHouseW = Math.max(0, Math.min(d.pvPower, d.consumption));
    const pvToHouse = pvToHouseW > (settings.flowThreshold || 30);

    const houseToGridW = Math.max(0, d.gridPower);     // export (positive gridPower)
    const gridToHouseW = Math.max(0, -d.gridPower);    // import (negative gridPower)
    const houseToBatteryW = Math.max(0, d.batteryPower);
    const houseToWallboxW = Math.max(0, d.wallboxPower);
    const houseToGrid = houseToGridW > (settings.flowThreshold || 30);
    const houseToBattery = houseToBatteryW > (settings.flowThreshold || 30);
    const houseToWallbox = houseToWallboxW > (settings.flowThreshold || 30);

    const gridToHouse = gridToHouseW > (settings.flowThreshold || 30);
    const batteryToHouse = Math.max(0, -d.batteryPower) > (settings.flowThreshold || 30);

    const hasWallbox = !!d.hasWallbox;
    const hasBattery = !!d.hasBattery;

    // Only auto-hide nodes based on presence (no more per-value toggles)
    const showWallbox = hasWallbox;
    const showBattery = hasBattery;

    // Hide wallbox node + lines if not present
    const wallboxNode = document.getElementById('node-wallbox');
    const wallboxLine1 = document.getElementById('flow-house-wallbox');
    if (wallboxNode) wallboxNode.style.display = showWallbox ? '' : 'none';
    if (wallboxLine1) wallboxLine1.style.display = showWallbox ? '' : 'none';

    // Hide battery node + lines if not present
    const batteryNode = document.getElementById('node-battery');
    const batteryLine1 = document.getElementById('flow-battery-house');
    const batteryLine2 = document.getElementById('flow-house-battery');
    if (batteryNode) batteryNode.style.display = showBattery ? '' : 'none';
    if (batteryLine1) batteryLine1.style.display = showBattery ? '' : 'none';
    if (batteryLine2) batteryLine2.style.display = showBattery ? '' : 'none';

    // Dynamically crop SVG when no wallbox (reduces visual height)
    const svgEl = document.getElementById('flow-svg');
    if (svgEl) {
      if (showWallbox) {
        svgEl.setAttribute('viewBox', '0 0 320 278');
      } else {
        svgEl.setAttribute('viewBox', '0 0 320 175');
      }
    }

    const chargeSplit = splitBatteryChargeW(d);

    setFlowLine('flow-pv-house', pvToHouse, false, pvToHouseW);
    setFlowLine('flow-grid-house', gridToHouse, false, gridToHouseW);
    setFlowLine('flow-house-grid', houseToGrid, false, houseToGridW);
    setFlowLine('flow-battery-house', batteryToHouse, false, Math.max(0, -d.batteryPower));
    setFlowLine('flow-house-battery', houseToBattery, false, chargeSplit.fromGridW);
    setFlowLine('flow-house-wallbox', houseToWallbox && showWallbox, false, d.wallboxPower);
  }

  function formatW(w) {
    const rounded = Math.round(w);
    if (Math.abs(rounded) >= 1000) {
      return (rounded / 1000).toFixed(1) + ' kW';
    }
    return rounded + ' W';
  }

  function splitBatteryChargeW(powerState) {
    // positive batteryPower = charging battery (in) -- matches E3DC native / portal sign
    const batteryChargeW = Math.max(0, powerState.batteryPower);
    if (batteryChargeW <= 0) {
      return { fromPvW: 0, fromGridW: 0 };
    }
    const pvAfterHouse = Math.max(0, powerState.pvPower - powerState.consumption);
    const fromPvW = Math.min(batteryChargeW, pvAfterHouse);
    const fromGridW = Math.max(0, batteryChargeW - fromPvW);
    return { fromPvW, fromGridW };
  }

  function setHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height });
    } else {
      Homey.setHeight(height);
    }
  }

  function selectedPlantId(settings) {
    if (settings.plantId == null) {
      return null;
    }
    return settings.plantId.id != null ? settings.plantId.id : settings.plantId;
  }

  function plantMatches(plant, plantId) {
    return String(plant.id) === String(plantId);
  }

  async function resolvePlant(Homey) {
    const settings = Homey.getSettings();
    const plants = await Homey.api('GET', '/');
    if (plants.length === 0) {
      return { errorMsg: 'widget.info.no-plants' };
    }
    const wantedId = selectedPlantId(settings);
    if (wantedId == null) {
      if (plants.length === 1) {
        const single = plants[0];
        // Auto-select + persist when only one HKW (uniform behavior)
        Homey.setSettings({ plantId: single });
        return single;
      } else if (plants.length > 1) {
        // Auto to first, like wallbox widget (no settings picker anymore)
        const first = plants[0];
        Homey.setSettings({ plantId: first });
        return first;
      }
      return { errorMsg: 'widget.info.no-plant-id' };
    }
    const device = plants.find(hps => plantMatches(hps, wantedId));
    if (device) {
      return device;
    }
    return { errorMsg: 'widget.info.plant-not-found' };
  }

  function showMessage(text) {
    document.getElementById('flow-container').classList.add('hidden');
    const info = document.getElementById('info-message');
    info.classList.remove('hidden');
    document.getElementById('info-message-value').innerText = text;
  }

  function showFlow() {
    document.getElementById('info-message').classList.add('hidden');
    document.getElementById('flow-container').classList.remove('hidden');
  }

  function applyLiveVisibility(settings, data) {
    // With simplified settings (only flowThreshold), always show all values
    // (nodes are auto-hidden only via hasWallbox/hasBattery above)
    // Values are always visible
  }

  async function sync(asInit) {
    try {
      const plant = await resolvePlant(Homey);
      if (plant.errorMsg) {
        showMessage(Homey.__ ? Homey.__(plant.errorMsg) : plant.errorMsg);
        setHeight(Homey, asInit, 100);
        return;
      }

      const settings = Homey.getSettings();
      updateFlow(plant, settings, Homey);
      applyLiveVisibility(settings, plant.powerState);
      showFlow();

      // Dynamic height for the flow diagram (no list below anymore)
      const dynamicHeight = plant.powerState.hasWallbox ? WIDGET_HEIGHT : 220;
      setHeight(Homey, asInit, dynamicHeight);
    } catch (e) {
      showMessage(e.toString());
      setHeight(Homey, asInit, 100);
    }
  }

  function configureHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height: height });
    } else {
      Homey.setHeight(height);
    }
  }

  // Initial call
  // The sync is called from onHomeyReady
</script>
</body>
</html>
