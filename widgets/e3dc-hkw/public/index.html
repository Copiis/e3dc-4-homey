<html>
<head>
  <style>
    /* Live energy flow styles */
    #info-message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--homey-su-4);
      text-align: center;
      color: #f0f0f0;
      font-size: 16px;
    }

    #flow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--homey-su-2) var(--homey-su-3);
      color: #f0f0f0;
    }

    #flow-svg {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    .node-box {
      fill: rgba(32, 32, 32, 0.95);
      stroke-width: 2;
    }

    .node-box.pv { stroke: #c48a0f; }
    .node-box.house { stroke: #7AB31B; }
    .node-box.grid { stroke: #5b8def; }
    .node-box.battery { stroke: #7AB31B; }
    .node-box.wallbox { stroke: #8b6cc1; }

    .node-icon {
      font-size: 20px;
      fill: #ffffff;
    }

    .node-label {
      fill: #e0e0e0;
      font-size: 13px;
    }

    .node-value {
      fill: #ffffff;
      font-size: 15px;
      font-weight: 600;
    }

    /* Secondary values (kWh, SOC) — same weight as W/kW for readability */
    .node-soc {
      fill: #f2f2f2;
      font-size: 13px;
      font-weight: 600;
    }

    .flow-line {
      stroke-width: 2;
      fill: none;
      opacity: 0.15;
      stroke: rgba(255, 255, 255, 0.35);
      transition: opacity 0.3s ease, stroke-width 0.3s ease;
    }

    .flow-line.active {
      opacity: 0.9;
      stroke-width: 2.5;
    }

    .flow-dot {
      display: none;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.45));
    }

    .flow-dot.active {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body class="homey-widget-full">
<div id="info-message" class="homey-widget hidden">
  <span id="info-message-value"></span>
</div>

<!-- Live Energy Flow -->
<div id="flow-container" class="homey-widget hidden">
  <svg id="flow-svg" viewBox="0 0 320 278" xmlns="http://www.w3.org/2000/svg">
    <!-- Fluss direkt in die Symbole (keine Boxen mehr) -->
    <line id="flow-pv-house" x1="160" y1="68" x2="160" y2="130" class="flow-line" data-color="#c48a0f"/>
    <line id="flow-grid-house" x1="27.5" y1="139" x2="125" y2="139" class="flow-line" data-color="#5b8def"/>
    <line id="flow-house-grid" x1="125" y1="161" x2="27.5" y2="161" class="flow-line" data-color="#5b8def"/>
    <line id="flow-battery-house" x1="252.5" y1="139" x2="185" y2="139" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-battery" x1="185" y1="161" x2="252.5" y2="161" class="flow-line" data-color="#7AB31B"/>
    <line id="flow-house-wallbox" x1="160" y1="180" x2="160" y2="220" class="flow-line" data-color="#8b6cc1"/>
    <g id="flow-dots"></g>

    <!-- PV — Sonne 50% größer, Werte mittig auf der Scheibe -->
    <g id="node-pv" transform="translate(124, 2)">
      <g transform="translate(36, 40) scale(1.5)">
        <!-- Strahlen (8 Stück) -->
        <g stroke="#C48A0F" stroke-width="3.2" stroke-linecap="round">
          <line x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(45)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(90)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(135)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(180)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(225)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(270)" x1="0" y1="-28" x2="0" y2="-21"/>
          <line transform="rotate(315)" x1="0" y1="-28" x2="0" y2="-21"/>
        </g>
        <!-- Sonnenscheibe -->
        <circle r="20" fill="#C48A0F" stroke="#222" stroke-width="2"/>
      </g>
      <text id="pv-value" x="36" y="37" class="node-value" text-anchor="middle">0 W</text>
      <text id="pv-today" x="36" y="54" class="node-soc" text-anchor="middle">—</text>
    </g>

    <!-- Haus — einfach, zentriert, Wert mittig -->
    <g id="node-house" transform="translate(108, 130)">
      <!-- House icon (einfach ohne Schornstein/Antenne/Fenster) -->
      <g transform="translate(12, 5)">
        <!-- roof -->
        <polygon points="0,0 40,-25 80,0" fill="#7AB31B" stroke="#222" stroke-width="2"/>
        <!-- body -->
        <rect x="8" y="2" width="64" height="45" fill="#7AB31B" stroke="#222" stroke-width="2"/>
        <!-- door -->
        <rect x="32" y="25" width="16" height="22" fill="#222"/>
      </g>
      <!-- Verbrauch sauber unter dem Haus -->
      <text id="house-value" x="57" y="24" class="node-value" text-anchor="middle">0 W</text>
    </g>

    <!-- Netz — Blitz: gleiche Breite/Höhe wie Batterie (52.5×74.9), Unterkante y=183.5 -->
    <g id="node-grid" transform="translate(5.25, 103)">
      <!-- Pfad 24×55 → 52.5×74.9; y-Offset 5.6 wie Batterie-Pol -->
      <g transform="translate(4.75, 5.6) scale(2.1875, 1.3618) translate(-5, 0)">
        <path d="M 23 0 L 8 26 L 16 26 L 5 55 L 29 21 L 17 21 Z" fill="#C48A0F" stroke="#C48A0F" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </g>
      <!-- W + Netzbezug + Netzeinspeisung (wie Batterie-Zeilen) -->
      <text id="grid-value" x="31" y="52" class="node-value" text-anchor="middle">0 W</text>
      <text id="grid-import" x="31" y="30" class="node-soc" text-anchor="middle">—</text>
      <text id="grid-export" x="31" y="74" class="node-soc" text-anchor="middle">—</text>
    </g>

    <!-- Batterie — hochkant, 50% vergrößert -->
    <g id="node-battery" transform="translate(252.5, 103)">
      <!-- Battery icon vertical (30% kleiner) -->
      <g transform="translate(5, 0) scale(0.7)">
        <!-- body tall (um 14px von oben + 25px von unten gekürzt) -->
        <rect x="0" y="20" width="75" height="95" rx="9" fill="none" stroke="#333" stroke-width="4.5"/>
        <!-- top cap -->
        <rect x="22.5" y="8" width="30" height="15" rx="3" fill="#7AB31B" stroke="#333" stroke-width="3"/>
        <!-- + and - on top -->
        <text x="12" y="38" font-size="15" fill="#333" font-weight="bold">+</text>
        <text x="52" y="38" font-size="15" fill="#333" font-weight="bold">−</text>
        <!-- fill level -->
        <rect x="6" y="29" width="63" height="77" rx="6" fill="#7AB31B" opacity="0.35"/>
        <!-- divider lines -->
        <line x1="25.5" y1="29" x2="25.5" y2="106" stroke="#333" stroke-width="1.5" opacity="0.4"/>
        <line x1="49.5" y1="29" x2="49.5" y2="106" stroke="#333" stroke-width="1.5" opacity="0.4"/>
      </g>
      <!-- Werte mittig im Symbol -->
      <text id="battery-value" x="31" y="36" class="node-value" text-anchor="middle">0 W</text>
      <text id="battery-soc" x="31" y="55" class="node-soc" text-anchor="middle">0%</text>
      <text id="battery-charge-time" x="31" y="71" class="node-soc" text-anchor="middle">—</text>
    </g>

    <!-- Wallbox: Auto Vorderansicht (ca. 72 px breit wie PV) -->
    <g id="node-wallbox" transform="translate(106, 215)">
      <g transform="translate(8, 4)">
        <!-- Außenspiegel -->
        <ellipse cx="6" cy="28" rx="6" ry="5" fill="#8B6CC1" stroke="#222" stroke-width="1.5"/>
        <ellipse cx="86" cy="28" rx="6" ry="5" fill="#8B6CC1" stroke="#222" stroke-width="1.5"/>
        <!-- Karosserie (Front) -->
        <path d="M14 22
                 C18 10, 30 4, 46 4
                 C62 4, 74 10, 78 22
                 L82 42
                 C82 50, 76 54, 68 54
                 L24 54
                 C16 54, 10 50, 10 42
                 Z"
              fill="#8B6CC1" stroke="#222" stroke-width="2"/>
        <!-- Windschutzscheibe -->
        <path d="M24 20
                 C28 12, 36 9, 46 9
                 C56 9, 64 12, 68 20
                 L66 30
                 C62 28, 54 27, 46 27
                 C38 27, 30 28, 26 30
                 Z"
              fill="#222" opacity="0.28"/>
        <!-- Kühlergrill / Stoßstange -->
        <rect x="22" y="40" width="48" height="6" rx="2" fill="#222" opacity="0.25"/>
        <!-- Scheinwerfer -->
        <ellipse cx="22" cy="36" rx="7" ry="4.5" fill="#E6A817" stroke="#222" stroke-width="1.2"/>
        <ellipse cx="70" cy="36" rx="7" ry="4.5" fill="#E6A817" stroke="#222" stroke-width="1.2"/>
        <!-- Kennzeichen-Andeutung -->
        <rect x="36" y="44" width="20" height="5" rx="1" fill="#222" opacity="0.35"/>
        <!-- Räder (Vorderansicht: untere Rundungen) -->
        <ellipse cx="24" cy="54" rx="9" ry="5" fill="#222"/>
        <ellipse cx="68" cy="54" rx="9" ry="5" fill="#222"/>
      </g>
      <!-- Leistung + Fahrzeug-SOC mittig auf dem Auto -->
      <text id="wallbox-value" x="54" y="28" class="node-value" text-anchor="middle">0 W</text>
      <text id="wallbox-soc" x="58" y="44" class="node-soc" text-anchor="middle">—</text>
    </g>
  </svg>
</div>

<script type="text/javascript">
  const SYNC_INTERVAL = 10000;
  /** Homey widget height with wallbox row. */
  const WIDGET_HEIGHT = 300;
  /**
   * Height without wallbox: must fit SVG viewBox 320×200 + container padding.
   * 220 was too short → battery/grid bottoms clipped (see Robert screenshot).
   */
  const WIDGET_HEIGHT_NO_WALLBOX = 255;
  const FLOW_DOT_COUNT = 2;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const flowAnim = {
    running: false,
    progress: {},
    dots: {},
  };

  function onHomeyReady(Homey) {
    initFlowDots();
    startFlowAnimation();
    setTimeout(() => {
      sync(true).then(() => autoSync());
    }, 250);
  }

  function autoSync() {
    sync(false).then(() => setTimeout(() => autoSync(), SYNC_INTERVAL));
  }

  function initFlowDots() {
    const container = document.getElementById('flow-dots');
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      flowAnim.progress[id] = 0;
      flowAnim.dots[id] = [];
      for (let i = 0; i < FLOW_DOT_COUNT; i++) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('class', 'flow-dot');
        dot.setAttribute('data-line', id);
        container.appendChild(dot);
        flowAnim.dots[id].push(dot);
      }
    });
  }

  function startFlowAnimation() {
    if (flowAnim.running) return;
    flowAnim.running = true;
    let lastTs = performance.now();

    function frame(ts) {
      const dt = Math.min(ts - lastTs, 50);
      lastTs = ts;
      animateFlowDots(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getLineCoords(line) {
    return {
      x1: parseFloat(line.getAttribute('x1')),
      y1: parseFloat(line.getAttribute('y1')),
      x2: parseFloat(line.getAttribute('x2')),
      y2: parseFloat(line.getAttribute('y2')),
      color: line.getAttribute('data-color') || '#7AB31B',
    };
  }

  function animateFlowDots(dt) {
    document.querySelectorAll('.flow-line').forEach(line => {
      const id = line.id;
      const dots = flowAnim.dots[id] || [];
      const active = line.classList.contains('active');
      const reverse = line.classList.contains('reverse');
      const coords = getLineCoords(line);
      const speed = 0.00035 * (1 + (line.getAttribute('data-power') || 0) / 2000);

      dots.forEach((dot, index) => {
        if (!active) {
          dot.classList.remove('active');
          return;
        }
        dot.classList.add('active');
        dot.setAttribute('fill', coords.color);

        const offset = index / FLOW_DOT_COUNT;
        let t = (flowAnim.progress[id] + offset) % 1;
        if (reverse) t = 1 - t;
        dot.setAttribute('cx', coords.x1 + (coords.x2 - coords.x1) * t);
        dot.setAttribute('cy', coords.y1 + (coords.y2 - coords.y1) * t);
      });

      if (active) {
        flowAnim.progress[id] = (flowAnim.progress[id] + speed * dt) % 1;
      }
    });
  }

  function setFlowLine(id, active, reverse, powerW) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', active);
    el.classList.toggle('reverse', !!reverse);
    if (active) {
      el.style.stroke = el.getAttribute('data-color');
      el.setAttribute('data-power', String(Math.abs(powerW || 0)));
    } else {
      el.style.stroke = '';
      el.removeAttribute('data-power');
    }
  }

  function setWidgetText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function updateFlow(plant, settings, Homey) {
    const d = plant.powerState;
    setWidgetText('pv-value', formatW(d.pvPower));
    setWidgetText('pv-today', formatKwh(d.pvTodayKwh));
    setWidgetText('house-value', formatW(d.consumption));
    setWidgetText('grid-value', formatW(Math.abs(d.gridPower)));
    setWidgetText('grid-import', formatKwh(d.gridImportTodayKwh));
    setWidgetText('grid-export', formatKwh(d.gridExportTodayKwh));
    setWidgetText('battery-value', formatW(d.batteryPower));
    setWidgetText('battery-soc', Math.round(d.batteryLevel) + '%');
    setWidgetText('battery-charge-time', d.chargeTime || '—');
    setWidgetText('wallbox-value', formatW(d.wallboxPower));
    const wbSoc = d.wallboxVehicleSoc;
    setWidgetText(
      'wallbox-soc',
      (typeof wbSoc === 'number' && wbSoc > 0 && wbSoc <= 100) ? (Math.round(wbSoc) + '%') : '—',
    );

    // Keep label simple as "Netz" — direction is now clear from the flow arrows
    setWidgetText('grid-label', 'Netz');

    const pvToHouseW = Math.max(0, Math.min(d.pvPower, d.consumption));
    const pvToHouse = pvToHouseW > (settings.flowThreshold || 30);

    const houseToGridW = Math.max(0, d.gridPower);     // export (positive gridPower)
    const gridToHouseW = Math.max(0, -d.gridPower);    // import (negative gridPower)
    const houseToBatteryW = Math.max(0, d.batteryPower);
    const houseToWallboxW = Math.max(0, d.wallboxPower);
    const houseToGrid = houseToGridW > (settings.flowThreshold || 30);
    const houseToBattery = houseToBatteryW > (settings.flowThreshold || 30);
    const houseToWallbox = houseToWallboxW > (settings.flowThreshold || 30);

    const gridToHouse = gridToHouseW > (settings.flowThreshold || 30);
    const batteryToHouse = Math.max(0, -d.batteryPower) > (settings.flowThreshold || 30);

    const hasWallbox = !!d.hasWallbox;
    const hasBattery = !!d.hasBattery;

    // Only auto-hide nodes based on presence (no more per-value toggles)
    const showWallbox = hasWallbox;
    const showBattery = hasBattery;

    // Hide wallbox node + lines if not present
    const wallboxNode = document.getElementById('node-wallbox');
    const wallboxLine1 = document.getElementById('flow-house-wallbox');
    if (wallboxNode) wallboxNode.style.display = showWallbox ? '' : 'none';
    if (wallboxLine1) wallboxLine1.style.display = showWallbox ? '' : 'none';

    // Hide battery node + lines if not present
    const batteryNode = document.getElementById('node-battery');
    const batteryLine1 = document.getElementById('flow-battery-house');
    const batteryLine2 = document.getElementById('flow-house-battery');
    if (batteryNode) batteryNode.style.display = showBattery ? '' : 'none';
    if (batteryLine1) batteryLine1.style.display = showBattery ? '' : 'none';
    if (batteryLine2) batteryLine2.style.display = showBattery ? '' : 'none';

    // Dynamically crop SVG when no wallbox (removes empty wallbox band only).
    // Battery/grid sit ~y=103..185 (bottom kWh on lightning) — viewBox must stay ≥ ~200
    // or the bottom of battery + grid export text is clipped (forum @RobertHerter).
    const svgEl = document.getElementById('flow-svg');
    if (svgEl) {
      if (showWallbox) {
        svgEl.setAttribute('viewBox', '0 0 320 278');
      } else {
        svgEl.setAttribute('viewBox', '0 0 320 200');
      }
    }

    const chargeSplit = splitBatteryChargeW(d);

    setFlowLine('flow-pv-house', pvToHouse, false, pvToHouseW);
    setFlowLine('flow-grid-house', gridToHouse, false, gridToHouseW);
    setFlowLine('flow-house-grid', houseToGrid, false, houseToGridW);
    setFlowLine('flow-battery-house', batteryToHouse, false, Math.max(0, -d.batteryPower));
    setFlowLine('flow-house-battery', houseToBattery, false, chargeSplit.fromGridW);
    setFlowLine('flow-house-wallbox', houseToWallbox && showWallbox, false, d.wallboxPower);
  }

  function formatW(w) {
    const rounded = Math.round(w);
    if (Math.abs(rounded) >= 1000) {
      return (rounded / 1000).toFixed(1) + ' kW';
    }
    return rounded + ' W';
  }

  function formatKwh(kwh) {
    if (typeof kwh !== 'number' || !isFinite(kwh) || kwh < 0) {
      return '—';
    }
    if (kwh >= 100) {
      return Math.round(kwh) + ' kWh';
    }
    return kwh.toFixed(1) + ' kWh';
  }

  function splitBatteryChargeW(powerState) {
    // positive batteryPower = charging battery (in) -- matches E3DC native / portal sign
    const batteryChargeW = Math.max(0, powerState.batteryPower);
    if (batteryChargeW <= 0) {
      return { fromPvW: 0, fromGridW: 0 };
    }
    const pvAfterHouse = Math.max(0, powerState.pvPower - powerState.consumption);
    const fromPvW = Math.min(batteryChargeW, pvAfterHouse);
    const fromGridW = Math.max(0, batteryChargeW - fromPvW);
    return { fromPvW, fromGridW };
  }

  function setHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height });
    } else {
      Homey.setHeight(height);
    }
  }

  function selectedPlantId(settings) {
    if (settings.plantId == null) {
      return null;
    }
    return settings.plantId.id != null ? settings.plantId.id : settings.plantId;
  }

  function plantMatches(plant, plantId) {
    return String(plant.id) === String(plantId);
  }

  async function resolvePlant(Homey) {
    const settings = Homey.getSettings();
    const plants = await Homey.api('GET', '/');
    if (plants.length === 0) {
      return { errorMsg: 'widget.info.no-plants' };
    }
    const wantedId = selectedPlantId(settings);
    if (wantedId == null) {
      if (plants.length === 1) {
        const single = plants[0];
        // Auto-select + persist when only one HKW (uniform behavior)
        Homey.setSettings({ plantId: single });
        return single;
      } else if (plants.length > 1) {
        // Auto to first, like wallbox widget (no settings picker anymore)
        const first = plants[0];
        Homey.setSettings({ plantId: first });
        return first;
      }
      return { errorMsg: 'widget.info.no-plant-id' };
    }
    const device = plants.find(hps => plantMatches(hps, wantedId));
    if (device) {
      return device;
    }
    return { errorMsg: 'widget.info.plant-not-found' };
  }

  function showMessage(text) {
    document.getElementById('flow-container').classList.add('hidden');
    const info = document.getElementById('info-message');
    info.classList.remove('hidden');
    document.getElementById('info-message-value').innerText = text;
  }

  function showFlow() {
    document.getElementById('info-message').classList.add('hidden');
    document.getElementById('flow-container').classList.remove('hidden');
  }

  function applyLiveVisibility(settings, data) {
    // With simplified settings (only flowThreshold), always show all values
    // (nodes are auto-hidden only via hasWallbox/hasBattery above)
    // Values are always visible
  }

  async function sync(asInit) {
    try {
      const plant = await resolvePlant(Homey);
      if (plant.errorMsg) {
        showMessage(Homey.__ ? Homey.__(plant.errorMsg) : plant.errorMsg);
        setHeight(Homey, asInit, 100);
        return;
      }

      const settings = Homey.getSettings();
      updateFlow(plant, settings, Homey);
      applyLiveVisibility(settings, plant.powerState);
      showFlow();

      // Dynamic height: full with wallbox, shorter without (but not so short that
      // battery / grid bottom values are cropped).
      const dynamicHeight = plant.powerState.hasWallbox
        ? WIDGET_HEIGHT
        : WIDGET_HEIGHT_NO_WALLBOX;
      setHeight(Homey, asInit, dynamicHeight);
    } catch (e) {
      showMessage(e.toString());
      setHeight(Homey, asInit, 100);
    }
  }

  function configureHeight(Homey, asInit, height) {
    if (asInit) {
      Homey.ready({ height: height });
    } else {
      Homey.setHeight(height);
    }
  }

  // Initial call
  // The sync is called from onHomeyReady
</script>
</body>
</html>
