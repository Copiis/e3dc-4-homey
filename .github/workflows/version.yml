name: Version

# Cuts a release: bumps the version, writes the changelog, commits, tags
# and pushes. Pushing the v* tag is what starts the Publish workflow.
#
# Optional secret: RELEASE_TOKEN — a fine-grained PAT with "Contents: write"
# on this repository. GitHub does not let a push made with the default
# GITHUB_TOKEN trigger another workflow, so without RELEASE_TOKEN the tag is
# created but Publish has to be started (Actions → Publish → Run workflow,
# or `gh workflow run Publish`). With RELEASE_TOKEN set, the tag push chains
# into Publish.
#
# Required for a full release: HOMEY_PAT on the Publish workflow
# (https://tools.developer.homey.app/me).

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version bump
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog in English, written for users (not a commit log)
        required: true
      changelog_de:
        type: string
        description: Changelog auf Deutsch (optional; sonst nur Englisch)
        required: false

permissions:
  contents: write

jobs:
  version:
    name: Bump version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Update Homey app version
        id: version
        uses: athombv/github-action-homey-app-version@master
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Add German changelog
        if: ${{ inputs.changelog_de != '' }}
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_DE: ${{ inputs.changelog_de }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.APP_VERSION;
          const de = process.env.CHANGELOG_DE;
          const file = '.homeychangelog.json';
          const log = JSON.parse(fs.readFileSync(file, 'utf8'));
          log[version] = log[version] || {};
          log[version].de = de;
          fs.writeFileSync(file, `${JSON.stringify(log, null, 2)}\n`);
          NODE

      - name: Sync package.json and lockfile
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Commit, tag and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.changelog }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES"

      - name: Summary
        env:
          TAG: v${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.changelog }}
          CHAINS: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          {
            echo "Tagged **$TAG**"
            echo ""
            echo "> $NOTES"
            echo ""
            if [ "$CHAINS" = "true" ]; then
              echo "The Publish workflow starts automatically from the tag."
            else
              echo "RELEASE_TOKEN is not set — start the Publish workflow next."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
