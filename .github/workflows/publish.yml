name: Publish

# Publishes to the Homey App Store (draft) and promotes the build to the
# Athom test channel. Triggered by a v* tag, or on demand.
#
# The normal path is the Version workflow, which bumps, tags and pushes.
# Tags pushed by GITHUB_TOKEN do not trigger this workflow — see the
# RELEASE_TOKEN note in version.yml. A tag you push by hand always triggers it.
#
# Required secret: HOMEY_PAT — the app owner's Personal Access Token from
# https://tools.developer.homey.app/me

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Homey App Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Check versions agree
        run: |
          APP_VERSION="$(node -p "require('./.homeycompose/app.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::.homeycompose/app.json is $APP_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${APP_VERSION}"
              exit 1
            fi
          fi

          if ! node -e "
            const log = require('./.homeychangelog.json');
            const v = require('./.homeycompose/app.json').version;
            if (!log[v] || !log[v].en) {
              console.error('No English changelog entry for ' + v);
              process.exit(1);
            }
          "; then
            echo "::error::.homeychangelog.json has no English entry for ${APP_VERSION}"
            exit 1
          fi

          echo "Publishing ${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish

      - name: Check app.json is in sync with .homeycompose
        run: git diff --exit-code -- app.json

      - name: Publish
        id: publish
        uses: athombv/github-action-homey-app-publish@master
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: Promote to Athom test channel
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: |
          npm install --no-save homey-api
          node .github/scripts/promote-athom-test.js

      - name: Link to the release
        run: |
          {
            echo "Manage the release at ${{ steps.publish.outputs.url }}"
            echo "Test install: https://homey.app/de-de/app/de.jnkconsulting.e3dc.v2/E3DC---HKW/test/"
          } >> "$GITHUB_STEP_SUMMARY"
